<style>

.menu a:nth-child(2){border-color:#ff2bd6}.menu a:nth-child(3){border-color:#61ff68}.menu a:nth-child(4){border-color:#ffd84a}
.menu a:hover,.menu a:focus-visible{transform:translateY(-3px) scale(1.02);box-shadow:0 0 20px #00eaff;background:#101b31;outline:none}.menu a:active{transform:scale(.96);filter:brightness(1.35)}
@media(max-width:820px),(pointer:coarse){.touch-controls.active{display:flex}.menu{grid-template-columns:repeat(2,1fr)}.top-actions{top:50px}.pill{padding:6px 9px}.brand{margin-top:2px}.game-frame{border-radius:15px}}

@media(max-width:480px){body{padding:5px 5px 108px}.brand{padding:8px 9px 20px}.brand img{max-height:76px}.brand-name{bottom:auto;margin-top:16px;padding:5px 10px;letter-spacing:.07em}.game-frame{margin-top:34px}.game-frame:has(.overlay:not(.hidden)){min-height:315px}.overlay{align-items:center;padding:8px}.hud{inset:7px 7px auto}.pill{font-size:10px}.top-actions{top:39px;right:7px}.round{width:35px;height:35px}.touch-controls{padding:0 10px}.touch-btn{width:60px;height:60px}.touch-btn.jump{width:72px;height:72px}.menu{gap:10px}.menu a{font-size:14px;min-height:58px;padding:8px 5px}.card{margin-top:0;padding:10px}.card h1{font-size:22px}.card p{font-size:11px}.neon-btn{padding:9px 13px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<script>
(()=>{
"use strict";
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),W=1280,H=720;
ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
const $=s=>document.querySelector(s),load=src=>{const i=new Image();i.src=src;return i};
const img={logo:load("https://jogogames.github.io/Jogos.Games/assets/logo-ildebrando.png"),idle:load("jogo1.png"),walk1:load("jogo5.png"),walk2:load("jogo6.png"),run:load("jogo6.png"),jump:load("jogo7.png"),coin:load("jogo10.png"),enemy:load("jogo13.png"),block:load("jogo11.png"),pipe:load("jogo12.png"),ground:load("jogo16.png")};
const sounds={jump:new Audio("jumping.wav"),coin:new Audio("coin.wav"),over:new Audio("gameover.wav"),music:new Audio("musicgame.mp3")};sounds.music.loop=true;sounds.music.volume=.25;sounds.jump.volume=.45;sounds.coin.volume=.55;sounds.over.volume=.55;
let muted=false,running=false,paused=false,last=0,camera=0,score=0,coinCount=0,speedLevel=1,spawnUntil=2100,shake=0;
let best=Number(localStorage.getItem("ildebrando-neon-best")||0);$("#best").textContent=best;
const keys={left:false,right:false,jump:false};
const player={x:250,y:420,w:108,h:164,vx:0,vy:0,grounded:false,coyote:0,jumpBuffer:0,facing:1,step:0,glow:0,dead:false};
let platforms=[],objects=[],particles=[],stars=[];
for(let i=0;i<95;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.7,r:Math.random()*2+.4,a:Math.random()});
function resetWorld(){platforms=[{x:-200,y:590,w:1300},{x:1250,y:590,w:760},{x:2130,y:590,w:900}];objects=[];particles=[];spawnUntil=2800;camera=0;score=coinCount=0;speedLevel=1;Object.assign(player,{x:250,y:420,vx:0,vy:0,grounded:false,coyote:0,jumpBuffer:0,facing:1,step:0,glow:0,dead:false});populate(0,2800);updateHud()}
function populate(from,to){for(let x=Math.max(620,from+120);x<to;x+=145+Math.random()*115){let r=Math.random();if(r<.22)objects.push({type:"enemy",x,y:548,w:56,h:44,dir:-1,phase:Math.random()*6});else if(r<.34)objects.push({type:"ghost",x,y:385+Math.random()*110,w:62,h:70,dir:-1,phase:Math.random()*6});else if(r<.45)objects.push({type:"mummy",x,y:500,w:52,h:90,dir:-1,phase:Math.random()*6});else if(r<.56)objects.push({type:"zombie",x,y:505,w:58,h:85,dir:-1,phase:Math.random()*6});else if(r<.76)objects.push({type:"block",x,y:430-Math.random()*105,w:68,h:68});else if(r<.91)objects.push({type:"pipe",x,y:490,w:78,h:100});let amount=3+Math.floor(Math.random()*4);for(let k=0;k<amount;k++)objects.push({type:"coin",x:x+18+k*43,y:390-Math.sin((k/(amount-1||1))*Math.PI)*105,w:38,h:38,t:Math.random()*6});if(Math.random()<.28)objects.push({type:Math.random()<.34?"enemy":Math.random()<.5?"mummy":"zombie",x:x+95,y:Math.random()<.5?548:500,w:56,h:Math.random()<.5?44:90,dir:-1,phase:Math.random()*6})}}
function extend(){let lastP=platforms[platforms.length-1],gap=105+Math.random()*95,start=lastP.x+lastP.w+gap,w=650+Math.random()*700;platforms.push({x:start,y:590-(Math.random()<.18?60:0),w});populate(spawnUntil,start+w);spawnUntil=start+w}
function play(name){if(muted)return;let a=sounds[name];try{a.currentTime=0;a.play()}catch(e){}}
function dust(x,y,color="#65efff",n=7){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,life:1,size:2+Math.random()*6,color})}
function blood(x,y){dust(x,y,"#ff174d",19);for(let i=0;i<5;i++)particles.push({x:x+(Math.random()-.5)*35,y:y+20,vx:(Math.random()-.5)*2,vy:Math.random(),life:1.6,size:5+Math.random()*8,color:"#9d002c"})}
function hit(a,b){return a.x+a.w*.18<b.x+b.w&&a.x+a.w*.82>b.x&&a.y+a.h*.12<b.y+b.h&&a.y+a.h>b.y}
function jump(){player.jumpBuffer=.14}
function update(dt){if(!running||paused||player.dead)return;dt=Math.min(dt,.032);speedLevel=1+Math.min(2.3,score/1800);let acc=player.grounded?4200:2600,max=760+speedLevel*85;
let move=(keys.right?1:0)-(keys.left?1:0);if(move){player.vx+=move*acc*dt;player.facing=move;player.step+=Math.abs(player.vx)*dt*1.9;if(player.grounded&&Math.abs(player.vx)>180&&Math.random()<.48)dust(player.x+player.w/2-player.facing*25,player.y+player.h-8,Math.random()<.5?"#00eaff":"#ff2bd6",2)}else player.vx*=Math.pow(player.grounded?.0003:.09,dt);player.vx=Math.max(-max,Math.min(max,player.vx));
if(keys.jump)player.jumpBuffer=.12;else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);player.coyote=player.grounded?.10:Math.max(0,player.coyote-dt);if(player.jumpBuffer>0&&player.coyote>0){player.vy=-990;player.grounded=false;player.coyote=0;player.jumpBuffer=0;play("jump");dust(player.x+player.w/2,player.y+player.h,"#ff4cda",12)}
player.vy+=3500*dt;player.vy=Math.min(1500,player.vy);let oldBottom=player.y+player.h;player.x+=player.vx*dt;player.y+=player.vy*dt;player.grounded=false;
let surfaces=platforms.map(p=>({x:p.x,y:p.y,w:p.w,h:70})).concat(objects.filter(o=>o.type==="block"||o.type==="pipe"));
for(const p of surfaces){if(player.x+player.w*.72>p.x&&player.x+player.w*.28<p.x+p.w&&oldBottom<=p.y+12&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;if(!player.grounded&&Math.abs(player.vx)>110&&Math.random()<.45)dust(player.x+player.w/2,p.y,"#4effa3",3);player.grounded=true}}
for(const o of objects){if(o.type==="coin"){o.t+=dt*6;if(!o.got&&hit(player,{x:o.x,y:o.y+Math.sin(o.t)*7,w:o.w,h:o.h})){o.got=true;coinCount++;score+=50;player.glow=1.2;play("coin");dust(o.x+20,o.y+20,"#ffe34d",16)}}else if(["enemy","ghost","mummy","zombie"].includes(o.type)){o.phase+=dt*(o.type==="mummy"||o.type==="zombie"?3:5);o.x+=o.dir*((o.type==="mummy"?38:o.type==="zombie"?45:o.type==="ghost"?72:55)+speedLevel*12)*dt;if(o.type==="ghost")o.y+=Math.sin(o.phase)*22*dt;if(hit(player,o)){if(player.vy>180&&player.y+player.h<o.y+28){o.dead=true;player.vy=-450;score+=o.type==="ghost"?180:o.type==="mummy"?150:100;shake=8;blood(o.x+o.w/2,o.y+o.h/2)}else gameOver()}}}
objects=objects.filter(o=>!o.got&&!o.dead&&o.x>camera-400);score+=Math.max(0,player.vx)*dt*.045;player.glow=Math.max(0,player.glow-dt);camera+=(Math.max(0,player.x-W*.32)-camera)*Math.min(1,dt*5.5);while(player.x>spawnUntil-1500)extend();platforms=platforms.filter(p=>p.x+p.w>camera-500);if(player.y>H+180)gameOver();shake*=.86;updateParticles(dt);updateHud()}
function updateParticles(dt){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=dt*1.8});particles=particles.filter(p=>p.life>0)}
function updateHud(){$("#score").textContent=Math.floor(score);$("#coins").textContent=coinCount}
function gameOver(){if(player.dead)return;document.querySelector(".touch-controls").classList.remove("active");player.dead=true;running=false;play("over");sounds.music.pause();let final=Math.floor(score);if(final>best){best=final;localStorage.setItem("ildebrando-neon-best",best);$("#best").textContent=best}$("#endTitle").textContent=final>=best&&final>0?"Novo recorde!":"Fim de jogo";$("#endText").textContent=`Você fez ${final} pontos e pegou ${coinCount} moedas.`;setTimeout(()=>$("#endOverlay").classList.remove("hidden"),500)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawSceneBrand(t){const x=W/2-290,y=82,w=580,h=190,r=26,phase=(t*.16)%(2*(w+h));ctx.save();ctx.globalAlpha=.94;ctx.fillStyle="#020615d9";ctx.shadowColor="#00eaff";ctx.shadowBlur=24;roundRect(x,y,w,h,r);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="#173b69";ctx.lineWidth=3;ctx.stroke();const perimeter=2*(w+h),p=phase/perimeter;ctx.setLineDash([120,perimeter-120]);ctx.lineDashOffset=-phase;ctx.strokeStyle=p<.5?"#00eaff":"#ff2bd6";ctx.lineWidth=7;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=22;roundRect(x,y,w,h,r);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=20;ctx.shadowColor="#ff2bd6";if(img.logo.complete&&img.logo.naturalWidth)ctx.drawImage(img.logo,x+55,y+20,w-110,112);ctx.shadowBlur=10;ctx.textAlign="center";ctx.font="900 22px Arial";ctx.fillStyle="#fff";ctx.fillText("PROFESSOR ILDEBRANDO LEANDRO",W/2,y+158);ctx.font="800 13px Arial";ctx.fillStyle="#71f8ff";ctx.fillText("FUGINDO DOS MONSTROS • CORRA • PULE • VENÇA",W/2,y+181);ctx.restore()}
function drawBg(t){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#080b2b");grad.addColorStop(.58,"#102b50");grad.addColorStop(1,"#07121c");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(const s of stars){s.a=.35+.35*Math.sin(t*.001+s.x);ctx.globalAlpha=s.a;ctx.fillStyle="#bfefff";ctx.shadowColor=Math.floor(s.x)%2?"#00eaff":"#ff2bd6";ctx.shadowBlur=7;ctx.fillRect((s.x-camera*.03+W)%W,s.y,s.r,s.r)}ctx.shadowBlur=0;ctx.globalAlpha=1;drawSceneBrand(t);for(let i=0;i<8;i++){let x=((i*240-camera*.12)%(W+300))-120;ctx.fillStyle="#0b1738";ctx.beginPath();ctx.moveTo(x,590);ctx.lineTo(x+140,280+i%3*35);ctx.lineTo(x+300,590);ctx.fill();ctx.strokeStyle=i%2?"#00eaff88":"#ff2bd677";ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10;ctx.stroke()}ctx.shadowBlur=0;ctx.strokeStyle="#00eaff44";ctx.lineWidth=1;for(let y=360;y<590;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=-camera%75;x<W;x+=75){ctx.beginPath();ctx.moveTo(x,360);ctx.lineTo(x,590);ctx.stroke()}for(let i=0;i<5;i++){let lx=((i*310-t*.12-camera*.2)%(W+380))-100;ctx.fillStyle=i%2?"#00eaff22":"#ff2bd622";ctx.shadowColor=i%2?"#00eaff":"#ff2bd6";ctx.shadowBlur=18;ctx.fillRect(lx,145+i*48,190,3)}ctx.shadowBlur=0}
function glowDraw(image,x,y,w,h,color="#00eaff",blur=13){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.drawImage(image,x,y,w,h);ctx.restore()}
function drawGhost(o){ctx.save();ctx.translate(o.x,o.y+Math.sin(o.phase)*7);ctx.shadowColor="#b8f7ff";ctx.shadowBlur=22;ctx.fillStyle="#d9fbffdf";ctx.beginPath();ctx.arc(o.w/2,25,29,Math.PI,0);ctx.lineTo(o.w,58);for(let i=3;i>=0;i--)ctx.quadraticCurveTo(i*o.w/4+o.w/8,72,i*o.w/4,58);ctx.closePath();ctx.fill();ctx.shadowBlur=4;ctx.fillStyle="#15122d";ctx.beginPath();ctx.ellipse(21,25,6,10,0,0,Math.PI*2);ctx.ellipse(42,25,6,10,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(31,44,8,10,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawMummy(o){ctx.save();ctx.translate(o.x,o.y);ctx.shadowColor="#f4ff9a";ctx.shadowBlur=13;ctx.fillStyle="#c9c49c";roundRect(7,4,o.w-14,o.h-6,13);ctx.fill();ctx.strokeStyle="#68634d";ctx.lineWidth=5;for(let y=13;y<o.h-4;y+=12){ctx.beginPath();ctx.moveTo(7,y);ctx.lineTo(o.w-7,y+6);ctx.stroke()}ctx.fillStyle="#15130b";ctx.fillRect(10,21,o.w-20,18);ctx.fillStyle="#ff244f";ctx.shadowColor="#ff174d";ctx.shadowBlur=10;ctx.beginPath();ctx.arc(20,30,4,0,Math.PI*2);ctx.arc(34,30,4,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawZombie(o){ctx.save();ctx.translate(o.x,o.y+Math.sin(o.phase)*2);ctx.shadowColor="#58ff66";ctx.shadowBlur=18;ctx.fillStyle="#517a53";roundRect(8,2,o.w-16,o.h-4,12);ctx.fill();ctx.fillStyle="#233728";ctx.fillRect(5,47,o.w-10,36);ctx.fillStyle="#b7ff4b";ctx.shadowColor="#61ff68";ctx.shadowBlur=12;ctx.beginPath();ctx.arc(21,24,5,0,Math.PI*2);ctx.arc(38,24,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#152019";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(17,40);ctx.lineTo(42,38);ctx.stroke();ctx.strokeStyle="#67a56e";ctx.beginPath();ctx.moveTo(10,55);ctx.lineTo(-5,72);ctx.moveTo(o.w-10,55);ctx.lineTo(o.w+6,68);ctx.stroke();ctx.restore()}
function drawWorld(t){ctx.save();ctx.translate(-camera,0);for(let pi=0;pi<platforms.length;pi++){let p=platforms[pi];for(let x=p.x;x<p.x+p.w;x+=120)ctx.drawImage(img.ground,x,p.y,122,72);let pc=pi%2?"#00eaff":"#00ff9d";ctx.fillStyle=pc;ctx.shadowColor=pc;ctx.shadowBlur=22;ctx.fillRect(p.x,p.y,p.w,7);ctx.fillStyle="#ff2bd6";ctx.shadowColor="#ff2bd6";ctx.fillRect(p.x,p.y+9,p.w,2);ctx.shadowBlur=0}for(const o of objects){if(o.type==="coin"){let cy=o.y+Math.sin(o.t)*7;ctx.strokeStyle="#fff24a";ctx.shadowColor="#ffd400";ctx.shadowBlur=18;ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x+o.w/2,cy+o.h/2,o.w*.72+Math.sin(o.t)*4,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;glowDraw(img.coin,o.x,cy,o.w,o.h,"#ffd400",24)}if(o.type==="block")glowDraw(img.block,o.x,o.y,o.w,o.h,"#ff9d00",15);if(o.type==="pipe")glowDraw(img.pipe,o.x,o.y,o.w,o.h,"#20ff79",20);if(o.type==="enemy")glowDraw(img.enemy,o.x,o.y+Math.sin(o.phase)*3,o.w,o.h,"#ff334f",18);if(o.type==="ghost")drawGhost(o);if(o.type==="mummy")drawMummy(o);if(o.type==="zombie")drawZombie(o)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=13;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.size*p.life),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;let sprite=img.idle;if(!player.grounded)sprite=img.jump;else if(Math.abs(player.vx)>35)sprite=(Math.floor(player.step/28)%2?img.walk1:img.walk2);let bob=player.grounded&&Math.abs(player.vx)>35?Math.sin(player.step/13)*4:0,stretch=Math.min(.09,Math.abs(player.vy)/700*.09),dw=player.w*(1-stretch),dh=player.h*(1+stretch),px=player.x+(player.w-dw)/2,py=player.y+bob+(player.h-dh);ctx.save();if(player.facing<0){ctx.translate(px+dw,0);ctx.scale(-1,1);px=0}let neon=player.glow>0?"#fff34d":(Math.sin(t*.004)>0.74?"#ff35dc":"#00eaff");ctx.shadowColor=neon;ctx.shadowBlur=player.glow>0?42:24;ctx.drawImage(sprite,px,py,dw,dh);ctx.restore();ctx.restore()}
function draw(t){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBg(t);drawWorld(t);ctx.restore();let vign=ctx.createRadialGradient(W/2,H/2,250,W/2,H/2,760);vign.addColorStop(0,"transparent");vign.addColorStop(1,"#0009");ctx.fillStyle=vign;ctx.fillRect(0,0,W,H)}
function loop(t){let dt=(t-last)/1000||0;last=t;update(dt);draw(t);requestAnimationFrame(loop)}
function begin(){resetWorld();document.querySelector(".touch-controls").classList.add("active");running=true;paused=false;$("#startOverlay").classList.add("hidden");$("#endOverlay").classList.add("hidden");$("#pause").textContent="⏸";if(!muted)sounds.music.play().catch(()=>{})}
$("#start").onclick=begin;$("#restart").onclick=begin;$("#pause").onclick=()=>{if(!running)return;paused=!paused;$("#pause").textContent=paused?"▶":"⏸";paused?sounds.music.pause():(!muted&&sounds.music.play().catch(()=>{}))};$("#sound").onclick=()=>{muted=!muted;$("#sound").textContent=muted?"🔇":"🔊";if(muted)sounds.music.pause();else if(running&&!paused)sounds.music.play().catch(()=>{})};$("#full").onclick=()=>{let el=document.querySelector(".game-frame");if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(["arrowleft","a"].includes(k))keys.left=true;if(["arrowright","d"].includes(k))keys.right=true;if(["arrowup","w"," "].includes(k)){keys.jump=true;jump();e.preventDefault()}if(k==="p")$("#pause").click()});document.addEventListener("keyup",e=>{let k=e.key.toLowerCase();if(["arrowleft","a"].includes(k))keys.left=false;if(["arrowright","d"].includes(k))keys.right=false;if(["arrowup","w"," "].includes(k)){keys.jump=false;if(player.vy<-280)player.vy*=.55}});
document.querySelectorAll(".touch-btn").forEach(b=>{let key=b.dataset.key;let down=e=>{e.preventDefault();b.classList.add("active");keys[key]=true;if(key==="jump")jump();b.setPointerCapture?.(e.pointerId)};let up=e=>{e.preventDefault();b.classList.remove("active");keys[key]=false};b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running&&!paused)$("#pause").click()});resetWorld();requestAnimationFrame(loop);
})();
</script>
